<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻聊 AI</title>
    <script>
      const githubPagesBase = '/qingliao-ai/';
      const isProjectPages = location.hostname.endsWith('.github.io')
        && location.pathname.startsWith(githubPagesBase);
      location.replace(isProjectPages ? githubPagesBase : '/');
    </script>
  </head>
  <body></body>
</html>
